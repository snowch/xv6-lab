name: Check and deploy xv6 Lab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install reference build tools
        run: apt-get update && apt-get install -y git ca-certificates gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu gcc make perl python3 chromium
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build xv6 from pinned sources
        run: tools/build-guest.sh
      - run: npm ci
      - name: Check committed editor bundle
        run: npm run build:editor && git diff --exit-code -- site/workbench/editor.js site/workbench/EDITOR-LICENSES.txt
      - run: npm test
      - name: Check desktop, tablet and phone UX in Chromium
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: .artifacts/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
